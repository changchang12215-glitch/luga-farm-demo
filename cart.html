<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>購物車｜嘍嘎果園</title>
<style>
:root{
  --forest:#284333;--forest2:#456651;--ink:#25312a;--muted:#6d776f;
  --paper:#fffdf8;--cream:#f4efe5;--cream2:#faf7f0;--peach:#d89472;
  --peach2:#b96f54;--line:rgba(40,67,51,.14);--danger:#a54e43;
  --shadow:0 18px 50px rgba(33,48,38,.10)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.container{width:min(1160px,calc(100% - 36px));margin:auto}
.topbar{position:sticky;top:0;z-index:60;background:rgba(255,253,248,.97);
border-bottom:1px solid var(--line);backdrop-filter:blur(12px);box-shadow:0 5px 20px rgba(30,45,35,.06)}
.nav{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:11px;color:var(--forest)}
.mark{width:45px;height:45px;border-radius:14px;background:var(--forest);color:#fff;display:grid;place-items:center;
font-family:"Noto Serif TC","PMingLiU",serif;font-size:26px;font-weight:900}
.brand b{font-size:19px;font-family:"Noto Serif TC","PMingLiU",serif;letter-spacing:.05em}
.navlinks{display:flex;align-items:center;gap:6px;overflow:auto}
.navlinks a{white-space:nowrap;padding:10px 12px;border-radius:10px;font-weight:850;font-size:14px;color:#35503e}
.navlinks a:hover{background:#edf2ed}
.cartlink{display:inline-flex!important;align-items:center;gap:7px;border:1px solid var(--line);background:#fff}
.badge{min-width:20px;height:20px;padding:0 5px;border-radius:999px;display:grid;place-items:center;background:var(--peach2);color:#fff;font-size:11px}
.pagehead{padding:50px 0 28px}
.eyebrow{font-size:12px;letter-spacing:.17em;font-weight:900;color:var(--forest2)}
h1{font-size:clamp(34px,5vw,56px);line-height:1.12;letter-spacing:-.04em;color:var(--forest);margin:8px 0 14px}
.lead{color:var(--muted);line-height:1.85;max-width:820px}
.notice{border-radius:18px;background:#f7f2ea;border:1px solid var(--line);padding:17px 19px;color:#58645c;line-height:1.75;font-size:14px}
.notice strong{color:var(--forest)}
.btn{border:0;border-radius:13px;min-height:48px;padding:0 20px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-dark{background:var(--forest);color:#fff}
.btn-light{background:#fff;color:var(--forest);border:1px solid var(--line)}
.btn-peach{background:var(--peach2);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 35px rgba(33,48,38,.07)}
footer{margin-top:70px;background:#1c2b21;color:#fff;padding:36px 0}
footer small{color:rgba(255,255,255,.6);line-height:1.8}
.stepbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0 0}
.step{padding:11px 10px;border-radius:12px;background:#efeee9;color:#7a817b;text-align:center;font-size:12px;font-weight:850}
.step.active{background:var(--forest);color:#fff}
.step.done{background:#dde9df;color:var(--forest)}
@media(max-width:760px){
 .nav{display:block;padding:9px 0}.brand{margin-bottom:7px}.navlinks{padding-bottom:3px}
 .pagehead{padding-top:34px}.stepbar{grid-template-columns:1fr 1fr}
}

.layout{display:grid;grid-template-columns:1.3fr .7fr;gap:22px;padding-bottom:70px}
.items{padding:10px 24px}
.item{display:grid;grid-template-columns:1fr 115px 120px 42px;gap:14px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
.item h3{margin:0 0 5px;color:var(--forest)} .item small{color:var(--muted)}
.item input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;text-align:center}
.remove{width:38px;height:38px;border:0;border-radius:50%;background:#f8efed;color:var(--danger);font-size:18px}
.summary{padding:24px;position:sticky;top:96px;height:max-content}
.summary h2{margin-top:0;color:var(--forest)}
.row{display:flex;justify-content:space-between;gap:20px;padding:10px 0;color:var(--muted)}
.row.total{border-top:1px solid var(--line);margin-top:8px;padding-top:17px;color:var(--forest);font-weight:950;font-size:20px}
.summary .btn{width:100%;margin-top:12px}
.empty{padding:50px 24px;text-align:center;color:var(--muted)}
.reserve-note{margin-top:15px;padding:14px;border-radius:13px;background:#fff5ef;color:#76594b;font-size:12px;line-height:1.7}
@media(max-width:850px){.layout{grid-template-columns:1fr}.summary{position:static}}
@media(max-width:620px){
 .items{padding:5px 16px}
 .item{grid-template-columns:1fr 90px;gap:10px}
 .item .lineprice{text-align:right}
 .remove{grid-column:2;justify-self:end}
}
</style></head>
<body>
<header class="topbar"><div class="container nav">
<a class="brand" href="index.html"><span class="mark">嘍</span><b>嘍嘎果園</b></a>
<nav class="navlinks"><a href="preorder.html">繼續選購</a><a class="cartlink" href="cart.html">購物車 <span class="badge" data-cart-count>0</span></a></nav>
</div></header>

<main><section class="pagehead"><div class="container">
<div class="eyebrow">YOUR CART</div><h1>購物車</h1>
<p class="lead">確認規格與盒數。這裡仍然沒有鎖住預購庫存。</p>
<div class="stepbar"><div class="step done">1 選購商品</div><div class="step active">2 購物車</div><div class="step">3 填資料／付款</div><div class="step">4 訂單完成</div></div>
</div></section>

<section><div class="container layout">
<div class="card items" id="items"></div>
<aside class="card summary">
<h2>訂單摘要</h2>
<div class="row"><span>商品小計</span><strong id="subtotal">NT$0</strong></div>
<div class="row"><span>運費</span><strong>待果園確認</strong></div>
<div class="row total"><span>目前合計</span><strong id="total">NT$0</strong></div>
<div class="reserve-note"><strong>下一步才進入庫存確認：</strong><br>正式版會在送往第三方付款前，再次向後端檢查剩餘量；若不足，要求調整，不直接超賣。</div>
<a class="btn btn-dark" id="checkoutBtn" href="checkout.html">前往填寫訂購資料</a>
<a class="btn btn-light" href="preorder.html">繼續選購</a>
</aside>
</div></section></main>

<footer><div class="container"><b>嘍嘎果園 · LOGA FARM</b><small><br>購物車 V2｜目前資料只存在本機瀏覽器。</small></div></footer>

<script>
const CART_KEY = "loga_cart_v2";
const LIMITS = {6:50,8:200,10:300,12:500};
const PRICES = {6:800,8:720,10:600,12:480};
const NAMES = {6:"豪華送禮版",8:"送禮自用兩相宜",10:"人氣首選",12:"經濟實惠"};

function loadCart(){
  try { return JSON.parse(localStorage.getItem(CART_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveCart(cart){
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  updateCartBadge();
}
function cartCount(){
  const c=loadCart(); return Object.values(c).reduce((a,b)=>a+Number(b||0),0);
}
function cartTotal(){
  const c=loadCart(); return Object.entries(c).reduce((sum,[k,q])=>sum+(PRICES[k]||0)*Number(q||0),0);
}
function updateCartBadge(){
  document.querySelectorAll("[data-cart-count]").forEach(el=>el.textContent=cartCount());
  document.querySelectorAll("[data-cart-total]").forEach(el=>el.textContent=money(cartTotal()));
}
function money(n){ return "NT$" + Number(n).toLocaleString("zh-TW"); }
document.addEventListener("DOMContentLoaded", updateCartBadge);

function render(){
 const c=loadCart(),box=document.getElementById("items");box.innerHTML="";
 let subtotal=0;const keys=Object.keys(c).filter(k=>Number(c[k])>0);
 const checkout=document.getElementById("checkoutBtn");
 checkout.style.pointerEvents=keys.length?"auto":"none";checkout.style.opacity=keys.length?"1":".45";
 if(!keys.length)box.innerHTML='<div class="empty"><div style="font-size:44px">🛒</div><h3>購物車目前是空的</h3><p>回選購頁挑一盒水蜜桃吧。</p><a class="btn btn-dark" href="preorder.html">前往選購商品</a></div>';
 keys.forEach(k=>{
   const q=Number(c[k]),line=q*PRICES[k];subtotal+=line;
   const el=document.createElement("div");el.className="item";
   el.innerHTML=`<div><h3>${k} 粒裝</h3><small>${NAMES[k]} · ${money(PRICES[k])}／盒</small></div>
   <input type="number" min="1" max="${LIMITS[k]}" value="${q}" data-q="${k}">
   <strong class="lineprice">${money(line)}</strong><button class="remove" data-r="${k}" aria-label="移除">×</button>`;
   box.appendChild(el);
 });
 document.getElementById("subtotal").textContent=money(subtotal);
 document.getElementById("total").textContent=money(subtotal);
 box.querySelectorAll("[data-q]").forEach(inp=>inp.onchange=()=>{
   const cart=loadCart(),k=inp.dataset.q;
   cart[k]=Math.min(LIMITS[k],Math.max(1,Number(inp.value||1)));saveCart(cart);render();
 });
 box.querySelectorAll("[data-r]").forEach(btn=>btn.onclick=()=>{const cart=loadCart();delete cart[btn.dataset.r];saveCart(cart);render();});
}
render();
</script></body></html>
