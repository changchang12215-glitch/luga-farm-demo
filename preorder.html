<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>選購商品｜嘍嘎果園</title>
<style>
:root{
  --forest:#284333;--forest2:#456651;--ink:#25312a;--muted:#6d776f;
  --paper:#fffdf8;--cream:#f4efe5;--cream2:#faf7f0;--peach:#d89472;
  --peach2:#b96f54;--line:rgba(40,67,51,.14);--danger:#a54e43;
  --shadow:0 18px 50px rgba(33,48,38,.10)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.container{width:min(1160px,calc(100% - 36px));margin:auto}
.topbar{position:sticky;top:0;z-index:60;background:rgba(255,253,248,.97);
border-bottom:1px solid var(--line);backdrop-filter:blur(12px);box-shadow:0 5px 20px rgba(30,45,35,.06)}
.nav{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:11px;color:var(--forest)}
.mark{width:45px;height:45px;border-radius:14px;background:var(--forest);color:#fff;display:grid;place-items:center;
font-family:"Noto Serif TC","PMingLiU",serif;font-size:26px;font-weight:900}
.brand b{font-size:19px;font-family:"Noto Serif TC","PMingLiU",serif;letter-spacing:.05em}
.navlinks{display:flex;align-items:center;gap:6px;overflow:auto}
.navlinks a{white-space:nowrap;padding:10px 12px;border-radius:10px;font-weight:850;font-size:14px;color:#35503e}
.navlinks a:hover{background:#edf2ed}
.cartlink{display:inline-flex!important;align-items:center;gap:7px;border:1px solid var(--line);background:#fff}
.badge{min-width:20px;height:20px;padding:0 5px;border-radius:999px;display:grid;place-items:center;background:var(--peach2);color:#fff;font-size:11px}
.pagehead{padding:50px 0 28px}
.eyebrow{font-size:12px;letter-spacing:.17em;font-weight:900;color:var(--forest2)}
h1{font-size:clamp(34px,5vw,56px);line-height:1.12;letter-spacing:-.04em;color:var(--forest);margin:8px 0 14px}
.lead{color:var(--muted);line-height:1.85;max-width:820px}
.notice{border-radius:18px;background:#f7f2ea;border:1px solid var(--line);padding:17px 19px;color:#58645c;line-height:1.75;font-size:14px}
.notice strong{color:var(--forest)}
.btn{border:0;border-radius:13px;min-height:48px;padding:0 20px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-dark{background:var(--forest);color:#fff}
.btn-light{background:#fff;color:var(--forest);border:1px solid var(--line)}
.btn-peach{background:var(--peach2);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 35px rgba(33,48,38,.07)}
footer{margin-top:70px;background:#1c2b21;color:#fff;padding:36px 0}
footer small{color:rgba(255,255,255,.6);line-height:1.8}
.stepbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0 0}
.step{padding:11px 10px;border-radius:12px;background:#efeee9;color:#7a817b;text-align:center;font-size:12px;font-weight:850}
.step.active{background:var(--forest);color:#fff}
.step.done{background:#dde9df;color:var(--forest)}
@media(max-width:760px){
 .nav{display:block;padding:9px 0}.brand{margin-bottom:7px}.navlinks{padding-bottom:3px}
 .pagehead{padding-top:34px}.stepbar{grid-template-columns:1fr 1fr}
}

.products{padding:10px 0 100px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.product{padding:23px;display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:start}
.pic{height:120px;border-radius:18px;background:
linear-gradient(rgba(255,247,239,.82),rgba(255,247,239,.82)),
url("assets/product-peach.webp") center/cover no-repeat;display:grid;place-items:center;font-size:52px}
.product h2{margin:0;color:var(--forest);font-size:25px}
.kicker{color:#795d4c;font-weight:850;margin:4px 0 8px}
.price{font-size:27px;color:var(--peach2);font-weight:950}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}
.stat{background:var(--cream2);border-radius:12px;padding:9px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}
.stat strong{color:var(--forest);font-size:14px}
.qtybox{display:grid;grid-template-columns:42px 1fr 42px;gap:7px;margin-top:13px}
.qtybox button{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--forest);font-size:19px}
.qtybox input{width:100%;padding:10px;text-align:center;border:1px solid var(--line);border-radius:10px}
.add{width:100%;margin-top:9px}
.bottomcart{position:fixed;z-index:80;left:0;right:0;bottom:0;background:rgba(255,253,248,.97);
border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(25,42,31,.11);backdrop-filter:blur(12px)}
.bottom-inner{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.cartmini small{display:block;color:var(--muted);font-size:11px} .cartmini strong{color:var(--forest);font-size:18px}
.mobilehint{display:none}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
@media(max-width:620px){
 .products{padding-bottom:120px}
 .product{grid-template-columns:78px 1fr;padding:17px;gap:13px}
 .pic{height:78px;border-radius:14px;font-size:35px}
 .product h2{font-size:21px}.price{font-size:23px}
 .stats{grid-template-columns:1fr 1fr 1fr;gap:5px}
 .stat{padding:7px 4px} .stat strong{font-size:12px}
 .bottom-inner{min-height:78px} .bottom-inner .btn{padding:0 14px}
 .mobilehint{display:block;color:var(--muted);font-size:11px;margin-top:6px}
}
</style></head>
<body>
<header class="topbar"><div class="container nav">
<a class="brand" href="index.html"><span class="mark">嘍</span><b>嘍嘎果園</b></a>
<nav class="navlinks">
<a href="shop.html">商品介紹</a>
<a class="cartlink" href="cart.html">購物車 <span class="badge" data-cart-count>0</span></a>
</nav></div></header>

<main>
<section class="pagehead"><div class="container">
<div class="eyebrow">CHOOSE YOUR PEACHES</div>
<h1>選規格、選盒數，就這麼簡單。</h1>
<p class="lead">這一頁只負責選商品。想先看重量分級、保存方式、預購與出貨規則，可以回商品介紹頁。</p>
<div class="stepbar"><div class="step active">1 選購商品</div><div class="step">2 購物車</div><div class="step">3 填資料／付款</div><div class="step">4 訂單完成</div></div>
</div></section>

<section class="products"><div class="container">
<div class="notice" style="margin-bottom:22px">
<strong>預購提醒：</strong>加入購物車只是選購，<strong>不代表數量已保留</strong>。正式版會在進入付款程序時，再由伺服器確認剩餘數量並建立短時間 RESERVED。
</div>
<div class="grid" id="grid"></div>
</div></section>
</main>

<div class="bottomcart">
  <div class="container bottom-inner">
    <div class="cartmini">
      <small>購物車</small>
      <strong><span data-cart-count>0</span> 盒 · <span data-cart-total>NT$0</span></strong>
      <div class="mobilehint">未進付款流程前，不保留預購庫存</div>
    </div>
    <a class="btn btn-dark" href="cart.html">查看購物車 →</a>
  </div>
</div>

<footer><div class="container"><b>嘍嘎果園 · LOGA FARM</b><small><br>選購商品 V2｜預購數量與售價目前皆為暫定。</small></div></footer>

<script>
const CART_KEY = "loga_cart_v2";
const LIMITS = {6:50,8:200,10:300,12:500};
const PRICES = {6:800,8:720,10:600,12:480};
const NAMES = {6:"豪華送禮版",8:"送禮自用兩相宜",10:"人氣首選",12:"經濟實惠"};

function loadCart(){
  try { return JSON.parse(localStorage.getItem(CART_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveCart(cart){
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  updateCartBadge();
}
function cartCount(){
  const c=loadCart(); return Object.values(c).reduce((a,b)=>a+Number(b||0),0);
}
function cartTotal(){
  const c=loadCart(); return Object.entries(c).reduce((sum,[k,q])=>sum+(PRICES[k]||0)*Number(q||0),0);
}
function updateCartBadge(){
  document.querySelectorAll("[data-cart-count]").forEach(el=>el.textContent=cartCount());
  document.querySelectorAll("[data-cart-total]").forEach(el=>el.textContent=money(cartTotal()));
}
function money(n){ return "NT$" + Number(n).toLocaleString("zh-TW"); }
document.addEventListener("DOMContentLoaded", updateCartBadge);

const products=[
{count:6,limit:50,price:800},
{count:8,limit:200,price:720},
{count:10,limit:300,price:600},
{count:12,limit:500,price:480}
];
const grid=document.getElementById("grid");
products.forEach(p=>{
  const el=document.createElement("article");el.className="card product";
  el.innerHTML=`
    <div class="pic">🍑</div>
    <div>
      <h2>${p.count} 粒裝</h2>
      <div class="kicker">${NAMES[p.count]}</div>
      <div class="price">${money(p.price)} <span style="font-size:11px;color:#777">暫定</span></div>
      <div class="stats">
        <div class="stat"><small>預購上限</small><strong>${p.limit} 盒</strong></div>
        <div class="stat"><small>已預購</small><strong>0 盒*</strong></div>
        <div class="stat"><small>剩餘</small><strong>${p.limit} 盒*</strong></div>
      </div>
      <div class="qtybox">
        <button type="button" data-minus>−</button>
        <input data-qty value="1" inputmode="numeric" aria-label="${p.count}粒裝數量">
        <button type="button" data-plus>＋</button>
      </div>
      <button class="btn btn-peach add" type="button" data-add>加入購物車</button>
      <div style="font-size:10px;color:var(--muted);margin-top:6px">＊V2 展示值，正式版接後台即時更新。</div>
    </div>`;
  const qty=el.querySelector("[data-qty]");
  el.querySelector("[data-minus]").onclick=()=>qty.value=Math.max(1,Number(qty.value||1)-1);
  el.querySelector("[data-plus]").onclick=()=>qty.value=Math.min(p.limit,Number(qty.value||1)+1);
  qty.onchange=()=>qty.value=Math.min(p.limit,Math.max(1,Number(qty.value||1)));
  el.querySelector("[data-add]").onclick=()=>{
    const cart=loadCart();const current=Number(cart[p.count]||0);const add=Number(qty.value||1);
    cart[p.count]=Math.min(p.limit,current+add);saveCart(cart);
    el.querySelector("[data-add]").textContent="✓ 已加入購物車";
    setTimeout(()=>el.querySelector("[data-add]").textContent="加入購物車",900);
  };
  grid.appendChild(el);
});
</script>
</body></html>
